<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>🏢 Pixel Office Demo</title>
<style>
  body { margin:0; background:#1a1a2e; display:flex; align-items:center; justify-content:center; height:100vh; }
  canvas { image-rendering: pixelated; border: 2px solid #333; }
</style></head><body>
<canvas id="c"></canvas>
<script>
const TILE = 16, ZOOM = 3, COLS = 16, ROWS = 12;
const W = COLS*TILE*ZOOM, H = ROWS*TILE*ZOOM;
const canvas = document.getElementById('c');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// Tile map: 0=wall, 1=floor
const map = [];
for(let r=0;r<ROWS;r++){
  map[r]=[];
  for(let c=0;c<COLS;c++){
    map[r][c]=(r===0||r===ROWS-1||c===0||c===COLS-1)?0:1;
  }
}

// Palettes
const PALETTES = [
  {skin:'#FFCC99',shirt:'#4488CC',pants:'#334466',hair:'#553322',shoes:'#222222'},
  {skin:'#FFCC99',shirt:'#CC4444',pants:'#333333',hair:'#FFD700',shoes:'#222222'},
  {skin:'#DEB887',shirt:'#44AA66',pants:'#334444',hair:'#222222',shoes:'#333333'},
];

const _='';
// Character template (16x24) - walk down standing frame
function mkChar(pal){
  const H=pal.hair,K=pal.skin,S=pal.shirt,P=pal.pants,O=pal.shoes,E='#FFFFFF';
  return {
    walkDown: [
      // Frame 0 (left step)
      [[_,_,_,_,_,_,H,H,H,H,_,_,_,_,_,_],[_,_,_,_,_,H,H,H,H,H,H,_,_,_,_,_],[_,_,_,_,_,H,H,H,H,H,H,_,_,_,_,_],[_,_,_,_,_,K,K,K,K,K,K,_,_,_,_,_],[_,_,_,_,_,K,E,K,K,E,K,_,_,_,_,_],[_,_,_,_,_,K,K,K,K,K,K,_,_,_,_,_],[_,_,_,_,_,K,K,K,K,K,K,_,_,_,_,_],[_,_,_,_,_,_,S,S,S,S,_,_,_,_,_,_],[_,_,_,_,_,S,S,S,S,S,S,_,_,_,_,_],[_,_,_,_,S,S,S,S,S,S,S,S,_,_,_,_],[_,_,_,_,S,S,S,S,S,S,S,S,_,_,_,_],[_,_,_,_,K,S,S,S,S,S,S,K,_,_,_,_],[_,_,_,_,_,S,S,S,S,S,S,_,_,_,_,_],[_,_,_,_,_,_,P,P,P,P,_,_,_,_,_,_],[_,_,_,_,_,P,P,P,P,P,P,_,_,_,_,_],[_,_,_,_,_,P,P,P,P,P,P,_,_,_,_,_],[_,_,_,_,P,P,_,_,_,_,P,P,_,_,_,_],[_,_,_,_,P,P,_,_,_,_,P,P,_,_,_,_],[_,_,_,_,O,O,_,_,_,_,_,O,O,_,_,_],[_,_,_,_,O,O,_,_,_,_,_,O,O,_,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_]],
      // Frame 1 (standing)
      [[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],[_,_,_,_,_,_,H,H,H,H,_,_,_,_,_,_],[_,_,_,_,_,H,H,H,H,H,H,_,_,_,_,_],[_,_,_,_,_,H,H,H,H,H,H,_,_,_,_,_],[_,_,_,_,_,K,K,K,K,K,K,_,_,_,_,_],[_,_,_,_,_,K,E,K,K,E,K,_,_,_,_,_],[_,_,_,_,_,K,K,K,K,K,K,_,_,_,_,_],[_,_,_,_,_,K,K,K,K,K,K,_,_,_,_,_],[_,_,_,_,_,_,S,S,S,S,_,_,_,_,_,_],[_,_,_,_,_,S,S,S,S,S,S,_,_,_,_,_],[_,_,_,_,S,S,S,S,S,S,S,S,_,_,_,_],[_,_,_,_,S,S,S,S,S,S,S,S,_,_,_,_],[_,_,_,_,K,S,S,S,S,S,S,K,_,_,_,_],[_,_,_,_,_,S,S,S,S,S,S,_,_,_,_,_],[_,_,_,_,_,_,P,P,P,P,_,_,_,_,_,_],[_,_,_,_,_,P,P,P,P,P,P,_,_,_,_,_],[_,_,_,_,_,P,P,_,_,P,P,_,_,_,_,_],[_,_,_,_,_,P,P,_,_,P,P,_,_,_,_,_],[_,_,_,_,_,P,P,_,_,P,P,_,_,_,_,_],[_,_,_,_,_,O,O,_,_,O,O,_,_,_,_,_],[_,_,_,_,_,O,O,_,_,O,O,_,_,_,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_]],
      // Frame 2 (right step)
      [[_,_,_,_,_,_,H,H,H,H,_,_,_,_,_,_],[_,_,_,_,_,H,H,H,H,H,H,_,_,_,_,_],[_,_,_,_,_,H,H,H,H,H,H,_,_,_,_,_],[_,_,_,_,_,K,K,K,K,K,K,_,_,_,_,_],[_,_,_,_,_,K,E,K,K,E,K,_,_,_,_,_],[_,_,_,_,_,K,K,K,K,K,K,_,_,_,_,_],[_,_,_,_,_,K,K,K,K,K,K,_,_,_,_,_],[_,_,_,_,_,_,S,S,S,S,_,_,_,_,_,_],[_,_,_,_,_,S,S,S,S,S,S,_,_,_,_,_],[_,_,_,_,S,S,S,S,S,S,S,S,_,_,_,_],[_,_,_,_,S,S,S,S,S,S,S,S,_,_,_,_],[_,_,_,_,K,S,S,S,S,S,S,K,_,_,_,_],[_,_,_,_,_,S,S,S,S,S,S,_,_,_,_,_],[_,_,_,_,_,_,P,P,P,P,_,_,_,_,_,_],[_,_,_,_,_,P,P,P,P,P,P,_,_,_,_,_],[_,_,_,_,_,P,P,P,P,P,P,_,_,_,_,_],[_,_,_,_,P,P,_,_,_,_,P,P,_,_,_,_],[_,_,_,_,P,P,_,_,_,_,P,P,_,_,_,_],[_,_,_,O,O,_,_,_,_,_,O,O,_,_,_,_],[_,_,_,O,O,_,_,_,_,_,O,O,_,_,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_]],
      // Frame 3 = Frame 1 (standing)
    ],
    typeDown: [
      // Frame 0 (arms out)
      [[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],[_,_,_,_,_,_,H,H,H,H,_,_,_,_,_,_],[_,_,_,_,_,H,H,H,H,H,H,_,_,_,_,_],[_,_,_,_,_,H,H,H,H,H,H,_,_,_,_,_],[_,_,_,_,_,K,K,K,K,K,K,_,_,_,_,_],[_,_,_,_,_,K,E,K,K,E,K,_,_,_,_,_],[_,_,_,_,_,K,K,K,K,K,K,_,_,_,_,_],[_,_,_,_,_,K,K,K,K,K,K,_,_,_,_,_],[_,_,_,_,_,_,S,S,S,S,_,_,_,_,_,_],[_,_,_,_,_,S,S,S,S,S,S,_,_,_,_,_],[_,_,_,_,S,S,S,S,S,S,S,S,_,_,_,_],[_,_,_,K,K,S,S,S,S,S,S,K,K,_,_,_],[_,_,_,_,K,S,S,S,S,S,S,K,_,_,_,_],[_,_,_,_,_,S,S,S,S,S,S,_,_,_,_,_],[_,_,_,_,_,_,P,P,P,P,_,_,_,_,_,_],[_,_,_,_,_,P,P,P,P,P,P,_,_,_,_,_],[_,_,_,_,_,P,P,P,P,P,P,_,_,_,_,_],[_,_,_,_,_,P,P,_,_,P,P,_,_,_,_,_],[_,_,_,_,_,O,O,_,_,O,O,_,_,_,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_]],
      // Frame 1 (arms shifted)
      [[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],[_,_,_,_,_,_,H,H,H,H,_,_,_,_,_,_],[_,_,_,_,_,H,H,H,H,H,H,_,_,_,_,_],[_,_,_,_,_,H,H,H,H,H,H,_,_,_,_,_],[_,_,_,_,_,K,K,K,K,K,K,_,_,_,_,_],[_,_,_,_,_,K,E,K,K,E,K,_,_,_,_,_],[_,_,_,_,_,K,K,K,K,K,K,_,_,_,_,_],[_,_,_,_,_,K,K,K,K,K,K,_,_,_,_,_],[_,_,_,_,_,_,S,S,S,S,_,_,_,_,_,_],[_,_,_,_,_,S,S,S,S,S,S,_,_,_,_,_],[_,_,_,_,S,S,S,S,S,S,S,S,_,_,_,_],[_,_,_,_,K,S,S,S,S,S,S,K,K,_,_,_],[_,_,_,_,K,S,S,S,S,S,S,_,K,_,_,_],[_,_,_,_,_,S,S,S,S,S,S,_,_,_,_,_],[_,_,_,_,_,_,P,P,P,P,_,_,_,_,_,_],[_,_,_,_,_,P,P,P,P,P,P,_,_,_,_,_],[_,_,_,_,_,P,P,P,P,P,P,_,_,_,_,_],[_,_,_,_,_,P,P,_,_,P,P,_,_,_,_,_],[_,_,_,_,_,O,O,_,_,O,O,_,_,_,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_]],
    ],
  };
}

// Sprite rendering
const spriteCache = new Map();
function renderSprite(spriteData, x, y) {
  const key = JSON.stringify(spriteData)+x+y;
  let imgData = spriteCache.get(JSON.stringify(spriteData));
  if (!imgData) {
    const sw = spriteData[0].length, sh = spriteData.length;
    const offC = document.createElement('canvas');
    offC.width = sw; offC.height = sh;
    const offCtx = offC.getContext('2d');
    const id = offCtx.createImageData(sw, sh);
    for (let r=0; r<sh; r++) {
      for (let c=0; c<sw; c++) {
        const color = spriteData[r][c];
        if (color && color !== '') {
          const idx = (r*sw+c)*4;
          const [cr,cg,cb] = hexToRgb(color);
          id.data[idx]=cr; id.data[idx+1]=cg; id.data[idx+2]=cb; id.data[idx+3]=255;
        }
      }
    }
    offCtx.putImageData(id,0,0);
    imgData = offC;
    spriteCache.set(JSON.stringify(spriteData), imgData);
  }
  ctx.drawImage(imgData, x*ZOOM, y*ZOOM, imgData.width*ZOOM, imgData.height*ZOOM);
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}

// Furniture sprites
const DESK_COLOR = '#A07828', DESK_DARK = '#6B4E0A', DESK_SURFACE = '#B8922E';
const PC_FRAME = '#555555', PC_SCREEN = '#6688CC', PC_BEZEL = '#3A3A5C';

function drawDesk(col, row) {
  const x=col*TILE*ZOOM, y=row*TILE*ZOOM, s=TILE*ZOOM;
  ctx.fillStyle=DESK_DARK; ctx.fillRect(x,y,s*2,s*2);
  ctx.fillStyle=DESK_COLOR; ctx.fillRect(x+ZOOM,y+ZOOM,s*2-ZOOM*2,s*2-ZOOM*2);
  ctx.fillStyle=DESK_SURFACE; ctx.fillRect(x+ZOOM*2,y+ZOOM*2,s*2-ZOOM*4,s*2-ZOOM*4);
}

function drawPC(col, row) {
  const x=col*TILE*ZOOM, y=row*TILE*ZOOM, s=TILE*ZOOM;
  ctx.fillStyle=PC_FRAME;
  ctx.fillRect(x+3*ZOOM,y+0*ZOOM,10*ZOOM,10*ZOOM);
  ctx.fillStyle=PC_BEZEL;
  ctx.fillRect(x+4*ZOOM,y+1*ZOOM,8*ZOOM,8*ZOOM);
  ctx.fillStyle=PC_SCREEN;
  ctx.fillRect(x+5*ZOOM,y+2*ZOOM,6*ZOOM,6*ZOOM);
  ctx.fillStyle='#444';
  ctx.fillRect(x+7*ZOOM,y+10*ZOOM,2*ZOOM,2*ZOOM);
  ctx.fillRect(x+5*ZOOM,y+12*ZOOM,6*ZOOM,2*ZOOM);
}

function drawChair(col, row) {
  const x=col*TILE*ZOOM, y=row*TILE*ZOOM;
  ctx.fillStyle='#6B4E0A';
  ctx.fillRect(x+5*ZOOM,y+0*ZOOM,6*ZOOM,10*ZOOM);
  ctx.fillStyle='#A07828';
  ctx.fillRect(x+6*ZOOM,y+2*ZOOM,4*ZOOM,6*ZOOM);
  ctx.fillStyle='#5C3D0A';
  ctx.fillRect(x+6*ZOOM,y+11*ZOOM,1*ZOOM,3*ZOOM);
  ctx.fillRect(x+9*ZOOM,y+11*ZOOM,1*ZOOM,3*ZOOM);
}

// BFS pathfinding
function bfs(sx,sy,tx,ty){
  if(sx===tx&&sy===ty)return[];
  const visited=new Set(), queue=[[sx,sy,[]]];
  visited.add(sy*COLS+sx);
  const dirs=[[0,-1],[0,1],[-1,0],[1,0]];
  while(queue.length){
    const [cx,cy,path]=queue.shift();
    for(const [dx,dy] of dirs){
      const nx=cx+dx, ny=cy+dy;
      const k=ny*COLS+nx;
      if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&map[ny][nx]===1&&!visited.has(k)){
        visited.add(k);
        const np=[...path,{col:nx,row:ny}];
        if(nx===tx&&ny===ty)return np;
        queue.push([nx,ny,np]);
      }
    }
  }
  return[];
}

// Seats (desk positions + sitting offset)
const seats = [
  {deskCol:3, deskRow:2, pcCol:4, pcRow:2, seatCol:4, seatRow:4, chairCol:4, chairRow:4},
  {deskCol:7, deskRow:2, pcCol:8, pcRow:2, seatCol:8, seatRow:4, chairCol:8, chairRow:4},
  {deskCol:11,deskRow:2, pcCol:12,pcRow:2, seatCol:12,seatRow:4, chairCol:12,chairRow:4},
];

// Characters
const chars = PALETTES.map((pal,i) => {
  const sprites = mkChar(pal);
  sprites.walkDown.push(sprites.walkDown[1]); // frame 3 = frame 1
  return {
    id: i,
    sprites,
    state: 'type', // type, idle, walk
    x: seats[i].seatCol * TILE,
    y: seats[i].seatRow * TILE,
    tileCol: seats[i].seatCol,
    tileRow: seats[i].seatRow,
    seatIdx: i,
    path: [],
    moveProgress: 0,
    frame: 0,
    frameTimer: 0,
    isActive: true,
    wanderTimer: 3 + Math.random()*5,
    activityTimer: 5 + Math.random()*10,
  };
});

// Block desk tiles from walking
for(const s of seats){
  map[s.deskRow][s.deskCol]=0;
  map[s.deskRow][s.deskCol+1]=0;
  map[s.deskRow+1][s.deskCol]=0;
  map[s.deskRow+1][s.deskCol+1]=0;
}

let lastTime = 0;
const WALK_SPEED = 40; // px/sec

function update(dt) {
  for(const ch of chars) {
    ch.frameTimer += dt;
    ch.activityTimer -= dt;

    // Toggle active/inactive
    if(ch.activityTimer <= 0) {
      ch.isActive = !ch.isActive;
      ch.activityTimer = 5 + Math.random()*10;
    }

    if(ch.state === 'type') {
      if(ch.frameTimer > 0.3) { ch.frameTimer=0; ch.frame=(ch.frame+1)%2; }
      if(!ch.isActive) {
        ch.state='idle'; ch.frame=0; ch.frameTimer=0;
        ch.wanderTimer = 0.5+Math.random()*2;
      }
    }
    else if(ch.state === 'idle') {
      if(ch.isActive) {
        // Go back to seat
        const seat = seats[ch.seatIdx];
        ch.path = bfs(ch.tileCol, ch.tileRow, seat.seatCol, seat.seatRow);
        if(ch.path.length > 0) { ch.state='walk'; ch.frame=0; ch.moveProgress=0; }
        else { ch.state='type'; ch.frame=0; }
      } else {
        ch.wanderTimer -= dt;
        if(ch.wanderTimer <= 0) {
          // Pick random walkable tile
          const targets = [];
          for(let r=1;r<ROWS-1;r++) for(let c=1;c<COLS-1;c++) if(map[r][c]===1) targets.push({col:c,row:r});
          const t = targets[Math.floor(Math.random()*targets.length)];
          ch.path = bfs(ch.tileCol, ch.tileRow, t.col, t.row);
          if(ch.path.length > 0) { ch.state='walk'; ch.frame=0; ch.moveProgress=0; }
          ch.wanderTimer = 2+Math.random()*4;
        }
      }
    }
    else if(ch.state === 'walk') {
      if(ch.frameTimer > 0.15) { ch.frameTimer=0; ch.frame=(ch.frame+1)%4; }
      if(ch.path.length === 0) {
        // Arrived
        if(ch.isActive) {
          const seat = seats[ch.seatIdx];
          if(ch.tileCol===seat.seatCol && ch.tileRow===seat.seatRow) {
            ch.state='type'; ch.frame=0;
          } else { ch.state='idle'; }
        } else { ch.state='idle'; ch.wanderTimer=1+Math.random()*3; }
        continue;
      }
      ch.moveProgress += (WALK_SPEED/TILE)*dt;
      const next = ch.path[0];
      const fx=ch.tileCol*TILE, fy=ch.tileRow*TILE;
      const tx=next.col*TILE, ty=next.row*TILE;
      const t = Math.min(ch.moveProgress, 1);
      ch.x = fx+(tx-fx)*t;
      ch.y = fy+(ty-fy)*t;
      if(ch.moveProgress >= 1) {
        ch.tileCol=next.col; ch.tileRow=next.row;
        ch.x=next.col*TILE; ch.y=next.row*TILE;
        ch.path.shift(); ch.moveProgress=0;
        // If became active while walking, repath
        if(ch.isActive && ch.path.length>0) {
          const seat=seats[ch.seatIdx];
          const last=ch.path[ch.path.length-1];
          if(last.col!==seat.seatCol||last.row!==seat.seatRow) {
            ch.path=bfs(ch.tileCol,ch.tileRow,seat.seatCol,seat.seatRow);
            ch.moveProgress=0;
          }
        }
      }
    }
  }
}

function render() {
  // Floor
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      if(map[r][c]===0) ctx.fillStyle='#2a2a3e';
      else ctx.fillStyle=((r+c)%2===0)?'#c8b87a':'#b8a86a';
      ctx.fillRect(c*TILE*ZOOM, r*TILE*ZOOM, TILE*ZOOM, TILE*ZOOM);
    }
  }
  // Wall detail
  ctx.fillStyle='#3a3a5e';
  ctx.fillRect(0,0,W,TILE*ZOOM);
  ctx.fillStyle='#4a4a6e';
  ctx.fillRect(0,(TILE-4)*ZOOM,W,4*ZOOM);

  // Furniture
  for(const s of seats) {
    drawDesk(s.deskCol, s.deskRow);
    drawPC(s.pcCol, s.pcRow);
    drawChair(s.chairCol, s.chairRow);
  }

  // Plant decoration
  ctx.fillStyle='#3D8B37';
  const px=2*TILE*ZOOM,py=6*TILE*ZOOM;
  ctx.fillRect(px+5*ZOOM,py,6*ZOOM,8*ZOOM);
  ctx.fillStyle='#B85C3A';
  ctx.fillRect(px+4*ZOOM,py+8*ZOOM,8*ZOOM,6*ZOOM);

  // Water cooler
  ctx.fillStyle='#88BBDD';
  const cx=14*TILE*ZOOM,cy=6*TILE*ZOOM;
  ctx.fillRect(cx+4*ZOOM,cy+1*ZOOM,8*ZOOM,8*ZOOM);
  ctx.fillStyle='#CCDDEE';
  ctx.fillRect(cx+5*ZOOM,cy+9*ZOOM,6*ZOOM,5*ZOOM);
  ctx.fillStyle='#666';
  ctx.fillRect(cx+5*ZOOM,cy+14*ZOOM,6*ZOOM,2*ZOOM);

  // Characters (sorted by y for depth)
  const sorted = [...chars].sort((a,b)=>a.y-b.y);
  for(const ch of sorted) {
    let sprite;
    if(ch.state==='type') sprite=ch.sprites.typeDown[ch.frame%2];
    else if(ch.state==='walk') sprite=ch.sprites.walkDown[ch.frame%4];
    else sprite=ch.sprites.walkDown[1]; // idle = standing
    renderSprite(sprite, ch.x, ch.y - 8); // offset up a bit

    // Status indicator
    const sx = ch.x*ZOOM + 8*ZOOM, sy = (ch.y-8)*ZOOM - 6*ZOOM;
    if(ch.state==='type') {
      ctx.fillStyle='#44BB66'; ctx.beginPath(); ctx.arc(sx,sy,3*ZOOM,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font=`${5*ZOOM}px monospace`; ctx.fillText('⌨',sx-4*ZOOM,sy+2*ZOOM);
    } else if(!ch.isActive) {
      ctx.fillStyle='#888'; ctx.font=`${4*ZOOM}px monospace`; ctx.fillText('💤',sx-4*ZOOM,sy+2*ZOOM);
    }
  }

  // Title
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,H-20*ZOOM,W,20*ZOOM);
  ctx.fillStyle='#aaa'; ctx.font=`${5*ZOOM}px monospace`;
  ctx.fillText('🏢 Pixel Office Demo — 3 AI Agents at Work', 4*ZOOM, H-8*ZOOM);
}

function gameLoop(time) {
  const dt = lastTime===0 ? 0 : Math.min((time-lastTime)/1000, 0.1);
  lastTime = time;
  update(dt);
  render();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script></body></html>
